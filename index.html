<style>
:root{color-scheme:light;

.stat span{display:block;font-size:14px;color:var(--text-secondary);margin-top:2px;line-height:1.3}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}.dot.g{background:var(--primary)}.dot.r{background:var(--danger)}.dot.k{background:#94A3B8}

.kv>b{font-weight:600;text-align:right;overflow-wrap:anywhere}.kv>span:first-child{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.mrow{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-3)}.mrow .lab{flex:0 0 84px;font-weight:600}.mrow .bt{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}.mrow .btn{min-height:44px;padding:8px}
label.opt{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border)}
.gauge{text-align:center}.gauge svg{width:100%;max-width:230px;display:block;margin:0 auto}
.clickable{cursor:pointer}
.sb{position:relative}.sb .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-secondary);pointer-events:none}
.sb input{padding-left:44px;min-height:54px;font-size:17px;border:1.5px solid var(--primary)}
.seg.s4{grid-template-columns:repeat(4,1fr);gap:4px;padding:4px}.seg.s4 button{font-size:13px;min-height:44px;padding:0 2px}
.banner.warn{background:var(--warning-bg);color:var(--warning)}.banner.err{background:var(--danger-bg);color:var(--danger-text)}
.bdg{position:absolute;top:-4px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.nav .pill{position:relative}
.qrbox{display:flex;align-items:center;justify-content:center;width:100%;max-width:240px;aspect-ratio:1;margin:0 auto 12px;border:2px dashed var(--border);border-radius:16px;background:var(--background);color:var(--text-secondary);text-align:center;padding:12px;font-size:14px;overflow:hidden}
.qrbox img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.pvimg{display:block;width:100%;max-height:360px;object-fit:contain;border-radius:14px;border:1px solid var(--border);background:var(--background);margin-top:12px}
.close{background:var(--primary-light);border-color:#BBF7D0}
.close .big{font-size:34px;line-height:1.15;font-weight:800;color:var(--primary);margin:6px 0}
.note{background:#fff;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px;border:1px solid #BBF7D0;white-space:pre-wrap}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.rej{background:var(--danger-bg);color:var(--danger-text);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.btn.bad{background:var(--danger-bg);border-color:var(--danger-bg);color:var(--danger-text)}
.fileb{position:relative;overflow:hidden}.fileb input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav:empty{display:none}
.nav div{display:flex;max-width:520px;margin:0 auto}
.nav button{flex:1;min-width:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;background:none;border:0;color:var(--text-secondary);font-size:12px;font-weight:500;cursor:pointer}
.nav .pill{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:99px}
.nav button.act{color:var(--primary);font-weight:700}.nav button.act .pill{background:var(--primary-light)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text-primary);color:#fff;padding:12px 18px;border-radius:14px;z-index:9;max-width:92%;text-align:center;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
@media(min-width:768px){#app{max-width:600px}.nav div{max-width:600px}.hd{border-radius:0 0 28px 28px}}
@media(max-width:380px){.hd h1{font-size:26px}.card{padding:var(--sp-4)}.mrow .lab{flex-basis:76px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== PASTE YOUR SUPABASE DETAILS HERE (Project Settings > API) =====
const SB_URL='https://adegvifdexzognfglmvs.supabase.co',SB_KEY='sb_publishable_gCj4Z9cmYErA6_sbJ-v9KQ_L02jbmAn';
// =====================================================================
const OWNER_LINK=/[?&]owner(=|&|$)/.test(location.search)||location.hash==='#owner';
const RECOVERY=/type=recovery/.test(location.hash+location.search);
const cfgOk=()=>!/PASTE_/.test(SB_URL+SB_KEY),sb=cfgOk()?supabase.createClient(SB_URL,SB_KEY):null;
const MEALS=[['L','🍛','Lunch'],['D','🍽️','Dinner']];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let S,tab='home',ui={reason:'Going home',note:'',date:''},toastMsg='';
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fd=k=>{const[y,m,d]=k.split('-');return +d+' '+MON[m-1]};
const fdy=k=>fd(k)+' '+k.slice(0,4);
const ft=iso=>{const d=new Date(iso);let h=d.getHours();return(h%12||12)+':'+pad(d.getMinutes())+' '+(h<12?'AM':'PM')};
let OFF=0;
function now(){return new Date(Date.now()+OFF+19800000+new Date().getTimezoneOffset()*60000)}
const mins=()=>{const d=now();return d.getHours()*60+d.getMinutes()};
const today=()=>key(now());
const blank=()=>({students:[],att:{},pay:{},leaves:[],user:null,student:null,loading:false,cfg:{},subs:[],audit:[],pg:false,ext:false});
const email=m=>m+'@messmate.app';
function save(){}
async function all(q){let out=[],i=0;for(;;){const{data,error}=await q().range(i,i+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;i+=1000}return out}
const mapSt=p=>({id:p.student_code,uid:p.id,name:p.name,room:p.room||'Not assigned',roll:p.roll_no||'',phone:p.mobile,location:p.location||'',fee:p.monthly_fee});
const mapSub=(r,c)=>({id:r.id,sid:c,fm:r.fee_month,amt:r.amount,pd:r.paid_on,ref:r.txn_ref,note:r.note||'',path:r.proof_path,status:r.status,reason:r.reject_reason||'',at:r.submitted_at,vat:r.verified_at});
const mapLv=(r,c)=>({id:r.id,sid:c,date:r.date,reason:r.reason,note:r.note||'',appliedAt:r.applied_at,status:'APPLIED'});
async function loadData(){const{data:{session}}=await sb.auth.getSession();const n=blank();if(!session){S=n;return}
try{const t=await sb.rpc('server_now');if(t.data)OFF=new Date(t.data).getTime()-Date.now()}catch(e){}
const{data:me}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(!me){await sb.auth.signOut();S=n;return}
const owner=me.role==='owner',ms=today().slice(0,8)+'01';
const profs=owner?await all(()=>sb.from('profiles').select('*').eq('role','student').order('student_code')):[me];
const A=await all(()=>{const q=sb.from('attendance').select('*').order('id');return owner?q.gte('date',ms):q});
const L=await all(()=>{const q=sb.from('leaves').select('*').order('id');return owner?q.gte('date',ms):q});
const P=await all(()=>sb.from('payments').select('*').order('paid_on').order('id'));
n.students=profs.map(mapSt);const code={};profs.forEach(p=>code[p.id]=p.student_code);
A.forEach(r=>{const c=code[r.student_id];if(!c)return;n.att[c]=n.att[c]||{};n.att[c][r.date]=n.att[c][r.date]||{};n.att[c][r.date][r.meal]=r.status});
L.forEach(r=>{const c=code[r.student_id];if(c)n.leaves.push(mapLv(r,c))});
P.forEach(r=>{const c=code[r.student_id];if(!c)return;(n.pay[c]=n.pay[c]||[]).push({d:r.paid_on,amt:r.amount,mode:r.mode,month:r.fee_month||'',sub:r.submission_id||null})});
n.ext='roll_no' in me;
/* new payment tables are optional: if payments_setup.sql was not run yet, the rest of the app still works */

const SB=await all(()=>sb.from('payment_submissions').select('*').order('id',{ascending:false}));SB.forEach(r=>{const k=code[r.student_id];if(k)n.subs.push(mapSub(r,k))});
if(owner){const au=await sb.from('payment_audit').select('*').order('id',{ascending:false}).limit(40);if(!au.error)n.audit=au.data||[]}
n.pg=true}catch(e){n.pg=false;n.cfg={};n.subs=[];n.audit=[]}
n.user={role:me.role,id:owner?'owner':me.student_code};S=n;sync()}
async function boot(){try{await loadData()}catch(e){S=blank();toast('Could not load data. Check your internet.')}}
const okMail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
async function doLogin(){const em=(ui.lid||'').trim().toLowerCase(),pw=ui.lpin||'';
if(!okMail(em))return toast('Enter a valid email address');if(pw.length<6)return toast('Password must be at least 6 characters');
const{error}=await sb.auth.signInWithPassword({email:em,password:pw});
if(error&&/not confirmed/i.test(error.message)){ui.vemail=em;ui.vcode='';ui.mode='verify';ui.vnext=Date.now()+60000;try{await sb.auth.resend({type:'signup',email:em})}catch(e){}render();return toast('Please verify your email first. We sent you a new code.')}
if(error)return toast('Wrong email or password');
await boot();const want=ui.lrole==='owner'?'owner':'student';
if(S.user&&S.user.role!==want){await sb.auth.signOut();S=blank();ui.lpin='';render();return toast(want==='owner'?'This is a student account. Please use the Student login.':'This is a mess owner account. Please use the Mess Owner login.')}
ui.lid='';ui.lpin='';tab=S.user&&S.user.role==='owner'?'otoday':'home';render();scrollTo(0,0)}
async function doForgot(){const em=(ui.fe||'').trim().toLowerCase();if(!okMail(em))return toast('Enter the email you signed up with');
const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
if(error)return toast(/rate|limit/i.test(error.message)?'Too many requests. Please wait a few minutes and try again.':'Could not send the email: '+error.message);
toast('If this email is registered, a reset link has been sent. Check your inbox and spam folder.')}
async function doReset(){const a=ui.np||'',b=ui.np2||'';if(a.length<6)return toast('Password must be at least 6 characters');if(a!==b)return toast('Passwords do not match');
const{error}=await sb.auth.updateUser({password:a});if(error)return toast('Could not change password: '+error.message);
ui.recovery=false;ui.np=ui.np2='';try{history.replaceState(null,'',location.pathname)}catch(e){}
await boot();tab=S.user&&S.user.role==='owner'?'otoday':'home';render();scrollTo(0,0);toast('Password changed successfully')}
async function doVerify(){const em=ui.vemail,code=(ui.vcode||'').replace(/\s/g,'');if(!/^\d{6,8}$/.test(code))return toast('Enter the code from your email');
const{error}=await sb.auth.verifyOtp({email:em,token:code,type:'signup'});
if(error)return toast(/expired|invalid/i.test(error.message)?'That code is incorrect or has expired. Tap Resend code to get a new one.':'Could not verify: '+error.message);
await boot();ui.vcode='';ui.vemail='';ui.mode='login';tab='home';render();scrollTo(0,0);if(S.user)toast('Email verified! Welcome to MessMate.');else toast('Email verified. Please log in.')}
async function doResend(){const wait=Math.ceil(((ui.vnext||0)-Date.now())/1000);if(wait>0)return toast('Please wait '+wait+' seconds before asking for another code.');
const{error}=await sb.auth.resend({type:'signup',email:ui.vemail});if(error)return toast(/rate|limit/i.test(error.message)?'Too many emails sent. Please wait a few minutes.':'Could not send the code: '+error.message);
ui.vnext=Date.now()+60000;toast('A new code was sent to '+ui.vemail+'. Check spam too.')}
async function doSignup(){const n=(ui.sn||'').trim(),em=(ui.se||'').trim().toLowerCase(),ph=(ui.sm||'').trim(),lc=(ui.sl||'').trim(),pw=ui.sp||'';
if(n.length<2)return toast('Enter your full name');if(!okMail(em))return toast('Enter a valid email address');if(!/^\d{10}$/.test(ph))return toast('Enter a valid 10-digit mobile number');if(pw.length<6)return toast('Password must be at least 6 characters');
const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{name:n,location:lc,mobile:ph}}});
if(error)return toast(/registered/i.test(error.message)?'This email is already registered. Please log in.':/rate/i.test(error.message)?'Too many attempts. Wait a few minutes and try again.':/database/i.test(error.message)?'Could not create the account. This mobile number may already be registered. Try a different number, or log in.':'Sign up failed: '+error.message);
if(data&&data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)return toast('This email is already registered. Please log in.');
if(!data.session){ui.vemail=em;ui.vcode='';ui.mode='verify';ui.vnext=Date.now()+60000;render();scrollTo(0,0);return toast('We sent a verification code to '+em)}
await boot();ui.sn=ui.se=ui.sm=ui.sl=ui.sp='';ui.mode='login';tab='home';render();scrollTo(0,0);if(S.user)toast('Account created! Your Student ID: '+S.user.id)}
async function ownerMark(code,m,v){if(!S.user||S.user.role!=='owner')return;const st=S.students.find(x=>x.id===code);if(!st)return;const k=today();
if(withStu(st,()=>leaveOn(k)))return toast('Student is on leave today');
const{error}=await sb.from('attendance').upsert({student_id:st.uid,date:k,meal:m,status:v},{onConflict:'student_id,date,meal'});if(error)return toast('Could not save. Try again.');
S.att[code]=S.att[code]||{};S.att[code][k]=S.att[code][k]||{};S.att[code][k][m]=v;refreshAtt()}

const OKT=['image/jpeg','image/png','image/webp'];
function checkImg(f){if(!f)return'Please choose a screenshot first';const okType=f.type?OKT.includes(f.type):/\.(jpe?g|png|webp)$/i.test(f.name);if(!okType)return'Only JPG, JPEG, PNG or WEBP images are allowed';if(f.size>5*1024*1024)return'Image is too large. The maximum size is 5 MB';if(f.size<100)return'This image looks empty. Please choose another one';return''}
function loadImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad image'))};i.src=u})}
async function shrink(f,max,type,q){const i=await loadImg(f),r=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*r));c.height=Math.max(1,Math.round(i.height*r));const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(i,0,0,c.width,c.height);return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),type,q))}
const toDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});

function expiry(){const t=now(),pre=today().slice(0,7),n=myLeaves().filter(l=>l.date.slice(0,7)===pre).length,e=new Date(t.getFullYear(),t.getMonth()+1,0);e.setDate(e.getDate()+n);return{n,txt:fdy(key(e)),sub:n?' (+'+n+' leave day'+(n>1?'s':'')+')':''}}
function ring(){const n=now(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),left=dim-n.getDate(),s=summary(),p=s.P,v=s.V,R=78,C=2*Math.PI*R,pct=Math.min(1,p/dim),len=C*pct,ang=-Math.PI/2+2*Math.PI*pct,kx=100+R*Math.cos(ang),ky=100+R*Math.sin(ang);
const arc=p>0?`<circle cx="100" cy="100" r="${R}" fill="none" stroke="url(#rg)" stroke-width="18" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 100 100)"/><circle cx="${kx}" cy="${ky}" r="11" fill="#15803D" stroke="#fff" stroke-width="4"/>`:'';
return`<div class="card gauge"><svg viewBox="0 0 200 200" role="img" aria-label="${p} days present out of ${dim} days this month, ${v} leave days"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/></linearGradient></defs><circle cx="100" cy="100" r="${R}" fill="none" stroke="#E2E8F0" stroke-width="18"/>${arc}
<circle cx="100" cy="100" r="62" fill="#fff"/><text x="100" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#15803D" style="letter-spacing:.5px">PRESENT DAYS</text><text x="100" y="114" text-anchor="middle" font-size="40" font-weight="800" fill="#17211B">${p}</text><text x="100" y="130" text-anchor="middle" font-size="11" fill="#64748B">of ${dim} days</text>
<circle cx="100" cy="153" r="17" fill="#DC2626" stroke="#fff" stroke-width="3"/><text x="100" y="159" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">${v}</text></svg>
<div class="grid3" style="margin-top:16px"><div class="stat"><b>${p}</b><span><i class="dot g"></i>Present</span></div><div class="stat"><b>${v}</b><span><i class="dot r"></i>Leave days</span></div><div class="stat"><b>${left}</b><span><i class="dot k"></i>Days left</span></div></div>
<p class="m" style="margin:12px 0 0">Red circle = leave days · ${MON[n.getMonth()]} ${n.getFullYear()}</p></div>`}
function home(){const t=today(),ls=leaveState(),l=leaveOn(t),d=day(t),f=fin();
const banner=f?`<div class="banner ok">${ic('check',20)}<span>Attendance finalized: ${d==='Not Marked'?'—':d}</span></div>`:`<div class="banner">${ic('info',20)}<span>Daily attendance will be finalized after 10:00 PM.</span></div>`;
const cards=MEALS.map(x=>{const v=eff(t,x[0]),closed=ls!=='NOT_APPLIED'&&!l;return`<div class="card"><div class="row"><div class="mt"><span class="mi">${ic('utensils',22)}</span><h2>${x[2]}</h2></div>${stChip(v)}</div>
<p class="m">Attendance is marked by the mess owner.</p><button class="btn" data-a="goleave" ${closed?'disabled':''}>${ic(closed?'lock':'cal',18)}${l?'On leave today':closed?'Applications closed':'Apply leave'}</button></div>`}).join('');
const s=summary();
return`<div class="hd"><h1>MessMate</h1><p>Welcome, ${esc(S.student.name)}</p><p class="dt">${now().toDateString()} · ${ft(now())}</p></div>${ring()}${banner}${cards}${leaveCard()}
<div class="card"><h2>Monthly Summary</h2><div class="stats">${[['Lunch',s.L],['Dinner',s.D],['Present Days',s.P],['Absent Days',s.A],['Leave Days',s.V],['Total Days',s.P+s.A+s.V]].map(a=>`<div class="stat"><b>${a[1]}</b><span>${a[0]}</span></div>`).join('')}</div>
<div class="kv" style="margin-top:16px"><span>Total Meals</span><b>${s.L+s.D}</b></div><div class="kv"><span>Plan Expiry${expiry().sub}</span><b>${expiry().txt}</b></div></div>${closingCard()}`}
function closingCard(){const c=closing();let head,big,msg;
if(!c.set){head='';big='Closing date not announced yet';msg='Your mess owner has not set a last working day yet. Check back later.'}
else{head=`<div class="kv" style="border:0;padding:0 0 4px"><span>Last day of mess</span><b>${fdl(c.d)}</b></div>`;
if(c.diff>1){big=c.diff+' days left';msg='Please plan your meals accordingly. The mess will operate until the date mentioned above.'}
else if(c.diff===1){big='1 day left';msg='Tomorrow is the last day of the mess. Please plan your meals accordingly.'}
else if(c.diff===0){big='Mess closes today';msg='Today is the last working day of the mess.'}
else{big='Mess period ended';msg='The mess closed on '+fdl(c.d)+'.'}}
return`<div class="card close" id="closing"><h2>${ic('cal',22)}Mess Closing Date</h2>${head}<div class="big">${big}</div><p class="m" style="margin:0;color:var(--text-primary)">${msg}</p>${c.set&&c.note?`<div class="note"><b>Notice from your mess owner</b><br>${esc(c.note)}</div>`:''}</div>`}
function leaveCard(){const ls=leaveState(),l=leaveOn(today()),lbl={NOT_APPLIED:'Not applied',APPLIED:'Applied',CLOSED:'Closed'}[ls];let body;
if(l)body=`<span class="chip i">${ic('cal',16)}Leave Applied</span><div style="margin-top:12px"><div class="kv"><span>Date</span><b>${fdy(l.date)}</b></div><div class="kv"><span>Reason</span><b>${esc(l.reason)}</b></div>${l.note?`<div class="kv"><span>Note</span><b>${esc(l.note)}</b></div>`:''}<div class="kv"><span>Applied at</span><b>${ft(l.appliedAt)}</b></div><div class="kv"><span>Status</span><b>${l.status}</b></div></div>`;
else if(ls==='CLOSED')body=`<span class="chip n">${ic('lock',16)}Applications Closed</span><p style="margin:12px 0 4px;font-weight:600">Leave application closed for today</p><p class="m" style="margin:0 0 16px">Closing time: 5:00 PM</p><button class="btn pri" disabled>${ic('lock',18)}Applications Closed</button>`;
else body=`<span class="chip">${ic('check',16)}Applications Open</span><p class="m" style="margin:8px 0 16px">Leave available until 5:00 PM</p>${F('Leave reason',`<select data-in="reason">${['Going home','Sick','Family function','Other'].map(r=>`<option ${ui.reason===r?'selected':''}>${r}</option>`).join('')}</select>`)}${F('Note (optional)',`<textarea rows="2" data-in="note" placeholder="Add a short note">${esc(ui.note)}</textarea>`)}<button class="btn pri" data-a="apply">Apply Leave</button>`;
return`<div class="card" id="leavecard"><h2>${ic('cal',22)}Apply for Today's Leave</h2><p class="m" style="margin:-4px 0 12px">Closing time: 5:00 PM · Status: ${lbl}</p>${body}</div>`}
function meals(){const t=today();if(!ui.date)ui.date=t;const ks=[...new Set([...Object.keys(AT()),...myLeaves().map(l=>l.date),t])].sort().reverse();
return`${hd('Meal History','Pick a date to see details')}<div class="card"><h2>Select date</h2>${F('Date',`<input type="date" value="${ui.date}" max="${t}" data-in="date">`)}${dayCard(ui.date,true)}</div><h2 class="sec">Previous days</h2>${ks.map(k=>dayCard(k)).join('')}`}
function leave(){const L=myLeaves().slice().sort((a,b)=>b.date.localeCompare(a.date));
return`${hd('Leave','Apply and review leave')}${leaveCard()}<h2 class="sec">Leave History</h2>${L.length?L.map(l=>`<div class="card"><div class="row"><b>${fdy(l.date)}</b><span class="chip i">${ic('cal',16)}${l.status==='APPLIED'?'Applied':esc(l.status)}</span></div><p class="m" style="margin:8px 0 0">Reason: ${esc(l.reason)}${l.note?'<br>Note: '+esc(l.note):''}<br>Applied at: ${ft(l.appliedAt)}</p></div>`).join(''):'<div class="card m">No leave applications yet.</div>'}`}
function payCard(fi,m){const c=S.cfg||{},ok=!!c.upi_id,modes=(c.modes&&c.modes.length?c.modes:['UPI','Cash']).join(', ');
const name=c.owner_name||'Mess Owner',upi=c.upi_id||'demo.owner@upi',phone=c.pay_phone||'Not provided';
const upiLink=ok?'upi://pay?pa='+encodeURIComponent(c.upi_id)+'&pn='+encodeURIComponent(name)+(fi.rem>0?'&am='+fi.rem+'.00':'')+'&cu=INR&tn='+encodeURIComponent('Mess fee '+monthLabel(m)):'';
const qr=c.qr_data?`<div class="qrbox"><img src="${c.qr_data}" alt="Mess owner UPI QR code"></div>`:`<div class="qrbox">${ic('qr',40)}<span style="margin-left:8px">DEMO QR placeholder.<br>Owner has not uploaded a QR code yet.</span></div>`;
const ext=c.qr_data&&(c.qr_data.slice(5,15)==='image/png;'?'png':c.qr_data.slice(5,16)==='image/jpeg;'?'jpg':'png');
return`<div class="card" id="paybill"><h2>${ic('wallet',22)}Pay Your Mess Bill</h2>
${ok?'':`<div class="banner warn">${ic('alert',20)}<span>DEMO details. Your mess owner has not entered real payment details yet. Do not pay to the details shown below.</span></div>`}
<div class="kv"><span>Owner</span><b>${esc(name)}${c.owner_name?'':' (demo)'}</b></div>
<div class="kv"><span>UPI ID</span><b>${esc(upi)}${ok?'':' (demo)'}</b></div>
<div class="kv"><span>Phone</span><b>${esc(phone)}</b></div>
${c.bank_details?`<div class="kv" style="align-items:flex-start"><span>Bank details</span><b class="pre" style="font-weight:500">${esc(c.bank_details)}</b></div>`:''}
<div class="kv"><span>Accepted modes</span><b>${esc(modes)}</b></div>
<div style="margin:16px 0 4px;text-align:center">${qr}</div>
${ui.qrbig&&c.qr_data?`<img class="pvimg" src="${c.qr_data}" alt="Large QR code" style="background:#fff;max-height:none">`:''}
<div class="stack" style="margin-top:12px">
<button class="btn out" data-a="copyupi" ${ok?'':'disabled'}>${ic('copy',18)}Copy UPI ID</button>
${c.qr_data?`<div class="two"><button class="btn out" data-a="qrview">${ic('qr',18)}${ui.qrbig?'Hide QR':'View QR'}</button><a class="btn out" href="${c.qr_data}" download="messmate-payment-qr.${ext}">${ic('download',18)}Download</a></div>`:''}
${ok?`<a class="btn pri" href="${esc(upiLink)}">${ic('wallet',18)}Pay with UPI${fi.rem>0?' · ₹'+fi.rem:''}</a>`:`<button class="btn pri" disabled>${ic('wallet',18)}Pay with UPI</button>`}
</div>
<p class="m" style="margin:12px 0 0">Opening your UPI app does not confirm a payment. After you pay, upload your payment screenshot below so the owner can verify it.</p>
${c.instructions?`<div class="note" style="background:var(--background);border-color:var(--border)"><b>Instructions from your mess owner</b><br>${esc(c.instructions)}</div>`:''}</div>`}
function stBadge(x){return x.status==='APPROVED'?`<span class="chip">${ic('check',16)}Payment Approved</span>`:x.status==='REJECTED'?`<span class="chip r">${ic('x',16)}Payment Rejected</span>`:`<span class="chip y">${ic('clock',16)}PENDING VERIFICATION</span>`}
function proofImg(path){return ui.pv&&ui.pv[path]&&URLS[path]?`<img class="pvimg" src="${URLS[path]}" alt="Payment screenshot"><a class="btn link" target="_blank" rel="noopener" href="${URLS[path]}">Open full size</a>`:''}
function proofForm(){if(!S.pg)return`<div class="card"><h2>${ic('upload',22)}Submit Payment Proof</h2><p class="m" style="margin:0">Payment proof upload is not available yet. Please ask your mess owner.</p></div>`;
const m=ui.pf_month||curMonth(),fi=feeInfo(m);
return`<div class="card" id="proofform"><h2>${ic('upload',22)}Submit Payment Proof</h2>
${ui.pf_done?`<div class="banner ok">${ic('check',20)}<span>Your payment proof has been submitted. Your mess owner will verify the payment.</span></div>`:''}
<p class="m" style="margin:0 0 16px">Paid already? Upload your screenshot and details. Your payment is only counted after the owner approves it.</p>
<div class="fl"><span>Payment screenshot (JPG, PNG or WEBP, up to 5 MB)</span><label class="btn out fileb">${ic('upload',18)}${ui.pf_file?'Change screenshot':'Choose from gallery'}<input type="file" accept="image/jpeg,image/png,image/webp" data-file="proof" aria-label="Choose payment screenshot"></label>
${ui.pf_err?`<p class="m" style="color:var(--danger-text);font-weight:600;margin:8px 0 0">${esc(ui.pf_err)}</p>`:''}
${ui.pf_file&&ui.pf_pre?`<img class="pvimg" src="${ui.pf_pre}" alt="Selected screenshot preview"><div class="row" style="margin-top:8px"><span class="m pre">${esc(ui.pf_file.name)} · ${Math.max(1,Math.round(ui.pf_file.size/1024))} KB</span><button class="btn sm link" data-a="pfclear">Remove</button></div>`:''}</div>
${F('Fee month',`<select data-in="pf_month">${monthOpts().map(o=>`<option value="${o}" ${o===m?'selected':''}>${monthLabel(o)}</option>`).join('')}</select>`)}
${F('Amount paid (₹)',`<input class="tx" type="number" inputmode="numeric" min="1" data-in="pf_amt" value="${esc(ui.pf_amt||'')}" placeholder="${fi.rem||fi.fee}">`)}
${F('Payment date',`<input type="date" data-in="pf_date" value="${ui.pf_date||today()}" max="${today()}">`)}
${F('UPI transaction / reference ID',`<input class="tx" data-in="pf_ref" value="${esc(ui.pf_ref||'')}" placeholder="e.g. 412345678901" autocomplete="off" autocapitalize="characters">`)}
${F('Note (optional)',`<textarea rows="2" data-in="pf_note" placeholder="Anything the owner should know">${esc(ui.pf_note||'')}</textarea>`)}
<button class="btn pri" data-a="psubmit" ${ui.psub?'disabled':''}>${ui.psub?'Submitting…':'Submit payment proof'}</button></div>`}
function mySubs(){if(!S.pg)return'';const L=S.subs.filter(x=>x.sid===S.student.id);
return`<h2 class="sec">My Payment Submissions</h2>${L.length?L.map(x=>`<div class="card"><div class="row" style="align-items:flex-start"><div><b>₹${x.amt}</b><div class="m">${monthLabel(x.fm)}</div></div>${stBadge(x)}</div>
<div style="margin-top:12px"><div class="kv"><span>Payment date</span><b>${fdy(x.pd)}</b></div><div class="kv"><span>Transaction ID</span><b>${esc(x.ref)}</b></div><div class="kv"><span>Submitted</span><b>${fdt(x.at)}</b></div>${x.status==='APPROVED'&&x.vat?`<div class="kv"><span>Approved</span><b>${fdt(x.vat)}</b></div>`:''}${x.note?`<div class="kv"><span>Note</span><b>${esc(x.note)}</b></div>`:''}</div>
${x.status==='PENDING'?`<p class="m" style="margin:12px 0 0">Your payment proof has been submitted. Your mess owner will verify the payment. It is not counted as paid until then.</p>`:''}
${x.status==='REJECTED'?`<div class="rej">Reason: ${esc(x.reason||'No reason given')}</div>`:''}
<div class="stack" style="margin-top:12px"><button class="btn out" data-a="pview" data-p="${esc(x.path)}">${ic('eye',18)}${ui.pv&&ui.pv[x.path]?'Hide screenshot':'View screenshot'}</button>${x.status==='REJECTED'?`<button class="btn pri" data-a="resub" data-id="${x.id}">${ic('upload',18)}Submit corrected proof</button>`:''}</div>${proofImg(x.path)}</div>`).join(''):'<div class="card m">You have not submitted any payment proof yet.</div>'}`}
function fees(){const m=curMonth(),fi=feeInfo(m),pend=S.subs.filter(x=>x.sid===S.student.id&&x.status==='PENDING').reduce((a,x)=>a+x.amt,0);
return`${hd('Fees','Mess fee details')}<div class="card"><div class="row"><h2 style="margin:0">${monthLabel(m)}</h2>${feeChip(fi.st)}</div><div style="margin-top:12px"><div class="kv"><span>Monthly Fee</span><b>₹${fi.fee}</b></div><div class="kv"><span>Paid this month</span><b style="color:var(--success)">₹${fi.paid}</b></div><div class="kv"><span>Remaining</span><b style="color:var(--danger-text)">₹${fi.rem}</b></div><div class="kv"><span>Due Date</span><b>${fdy(fi.due)}</b></div><div class="kv"><span>Payment Mode</span><b>${esc(((S.cfg||{}).modes||['UPI','Cash']).join(', '))}</b></div><div class="kv"><span>Plan Expiry${expiry().sub}</span><b>${expiry().txt}</b></div></div>
<p class="m" style="margin:12px 0 0">Only payments approved by the mess owner count as paid.${pend?` ₹${pend} is waiting for verification and is not counted yet.`:''}</p></div>
${payCard(fi,m)}${proofForm()}${mySubs()}
<h2 class="sec">Payment History</h2>${PY().length?PY().slice().reverse().map(p=>`<div class="card row"><div><b>₹${p.amt}</b><div class="m">${fdy(p.d)}${p.month?' · for '+monthLabel(p.month):''}</div></div><span class="chip">${ic('check',16)}${esc(p.mode)} · Paid</span></div>`).join(''):'<div class="card m">No verified payments yet.</div>'}`}
function profile(){const s=S.student;
return`${hd('Profile',esc(s.name))}<div class="card">${[['Name',s.name],['Student ID',s.id],['Room Number',s.room],...(s.roll?[['Roll Number',s.roll]]:[]),['Phone Number',s.phone],...(s.location?[['Location',s.location]]:[])].map(a=>`<div class="kv"><span>${a[0]}</span><b>${esc(a[1])}</b></div>`).join('')}</div>
<button class="btn out" data-a="logout">${ic('logout',18)}Log out</button>`}
const AT=()=>S.att[S.student.id]||(S.att[S.student.id]={}),PY=()=>S.pay[S.student.id]||[];
function sync(){S.student=S.user&&S.user.role==='student'?S.students.find(x=>x.id===S.user.id)||null:null;if(S.user&&S.user.role==='student'&&!S.student)S.user=null}
function withStu(st,fn){const o=S.student;S.student=st;try{return fn()}finally{S.student=o}}
const allStats=()=>S.students.map(st=>withStu(st,()=>({st,s:summary(),l:leaveOn(today()),td:day(today())})));
const tile=a=>`<div class="stat"><b>${a[1]}</b><span>${a[0]}</span></div>`;
/* ===== sign in / sign up ===== */
function resetScreen(){return`${hd('MessMate','Set a new password')}<div class="card"><h2>Choose a new password</h2>${pwf('New password','np','At least 6 characters','new-password')}${pwf('Confirm new password','np2','Re-enter the password','new-password')}<button class="btn pri" data-a="doreset">Save new password</button></div>`}
function login(){const V=k=>esc(ui[k]||'');
if(ui.mode==='forgot')return`${hd('MessMate','Reset your password')}<div class="card"><h2>Forgot password?</h2><p class="m" style="margin:0 0 16px">Enter your email and we will send you a link to set a new password.</p>${F('Email',`<input class="tx" type="email" data-in="fe" value="${V('fe')}" placeholder="you@example.com" autocomplete="email">`)}<div class="stack"><button class="btn pri" data-a="forgot">Send reset link</button><button class="btn link" data-a="smode" data-m="login">Back to log in</button></div></div>`;
if(ui.mode==='verify')return`${hd('MessMate','Verify your email')}<div class="card"><h2>Enter your code</h2><p class="m" style="margin:0 0 16px">We sent a verification code to <b style="color:var(--text-primary)">${esc(ui.vemail||'')}</b>. It can take a minute. Check your spam folder too.</p>${F('Verification code',`<input class="tx" inputmode="numeric" autocomplete="one-time-code" maxlength="8" data-in="vcode" value="${V('vcode')}" placeholder="6-digit code" style="font-size:22px;letter-spacing:6px;text-align:center">`)}<div class="stack"><button class="btn pri" data-a="verify">Verify</button><button class="btn out" data-a="resend">Resend code</button><button class="btn link" data-a="smode" data-m="login">Back to log in</button></div></div>`;
if(ui.mode==='signup')return`${hd('MessMate','Sign up to get started')}<div class="card"><h2>Create student account</h2>${F('Full name',`<input class="tx" data-in="sn" value="${V('sn')}" placeholder="Your full name" autocomplete="name">`)}${F('Email',`<input class="tx" type="email" data-in="se" value="${V('se')}" placeholder="you@example.com" autocomplete="email">`)}${F('Mobile number',`<input class="tx" type="tel" inputmode="numeric" maxlength="10" data-in="sm" value="${V('sm')}" placeholder="10-digit mobile number" autocomplete="tel">`)}${F('Location (optional)',`<input class="tx" data-in="sl" value="${V('sl')}" placeholder="City or hometown" autocomplete="off">`)}${pwf('Password','sp','At least 6 characters','new-password')}<div class="stack"><button class="btn pri" data-a="signup">Create Account</button><button class="btn out" data-a="smode" data-m="login">Already registered? Log in</button></div></div>`;
const own=ui.lrole==='owner';
const seg=`<div class="seg" role="group" aria-label="Login type"><button type="button" data-a="lrole" data-r="student" aria-pressed="${!own}">${ic('user',18)}Student</button><button type="button" data-a="lrole" data-r="owner" aria-pressed="${own}">${ic('dash',18)}Mess Owner</button></div>`;
if(own)return`${hd('MessMate','Mess owner login')}<div class="card">${seg}<h2>Mess owner log in</h2>${F('Owner email',`<input class="tx" type="email" data-in="lid" value="${V('lid')}" placeholder="owner@example.com" autocomplete="email">`)}${pwf('Password','lpin','Your password','current-password')}<div class="stack"><button class="btn pri" data-a="login">Log in as owner</button><button class="btn link" data-a="smode" data-m="forgot">Forgot password?</button></div><p class="m" style="margin:16px 0 0;text-align:center">Owner accounts are set up by the app administrator. Students cannot sign up here.</p></div>`;
return`${hd('MessMate','Student login')}<div class="card">${seg}<h2>Student log in</h2>${F('Email',`<input class="tx" type="email" data-in="lid" value="${V('lid')}" placeholder="you@example.com" autocomplete="email">`)}${pwf('Password','lpin','Your password','current-password')}<div class="stack"><button class="btn pri" data-a="login">Log in</button><button class="btn link" data-a="smode" data-m="forgot">Forgot password?</button><button class="btn out" data-a="smode" data-m="signup">New student? Sign up</button></div></div>`}
/* ===== owner screens ===== */
const matchSt=(st,q)=>{q=(q||'').trim().toLowerCase();return!q||[st.name,st.id,st.roll,st.room].some(v=>v&&String(v).toLowerCase().includes(q))};
function attData(){const m=ui.omeal||'L',t=today();return{m,R:S.students.map(st=>withStu(st,()=>({st,l:leaveOn(t),e:eff(t,m)})))}}
function attCounts(D){const R=D.R;return[['Present',R.filter(r=>!r.l&&r.e==='P').length],['Absent',R.filter(r=>!r.l&&r.e==='A').length],['Not marked',R.filter(r=>!r.l&&!r.e).length],['On leave',R.filter(r=>r.l).length]].map(tile).join('')}
function attList(D){const q=(ui.osq||'').trim(),L=D.R.filter(r=>matchSt(r.st,q));
