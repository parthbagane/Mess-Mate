.kv>b{font-weight:600;text-align:right;overflow-wrap:anywhere}.kv>span:first-child{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.mrow{display:flex;align-items:center;gap:var(--sp-3);margin-top:var(--sp-3)}.mrow .lab{flex:0 0 84px;font-weight:600}.mrow .bt{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}.mrow .btn{min-height:44px;padding:8px}

.nav button.act{color:var(--primary);font-weight:700}.nav button.act .pill{background:var(--primary-light)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text-primary);color:#fff;padding:12px 18px;border-radius:14px;z-index:9;max-width:92%;text-align:center;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
@media(min-width:768px){#app{max-width:600px}.nav div{max-width:600px}.hd{border-radius:0 0 28px 28px}}
@media(max-width:380px){.hd h1{font-size:26px}.card{padding:var(--sp-4)}.mrow .lab{flex-basis:76px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body><main id="app"></main><nav class="nav" id="nav" aria-label="Main navigation"></nav>

<div class="card"><h2>Fees</h2><div class="kv"><span>Monthly Fee</span><b>₹${fee}</b></div><div class="kv"><span>Paid this month</span><b style="color:var(--success)">₹${paid}</b></div><div class="kv"><span>Remaining</span><b style="color:var(--danger-text)">₹${Math.max(0,fee-paid)}</b></div></div>
<div class="card"><h2>Edit student</h2>${F('Room number',`<input class="tx" data-in="eroom" value="${esc(ui.eroom||'')}" placeholder="e.g. B-203">`)}${F('Monthly fee (₹)',`<input class="tx" type="number" inputmode="numeric" data-in="efee" value="${esc(ui.efee||'')}" placeholder="e.g. 3000">`)}<button class="btn out" data-a="osave">Save</button></div>
<div class="card"><h2>Record payment</h2>${F('Amount (₹)',`<input class="tx" type="number" inputmode="numeric" data-in="pamt" value="${esc(ui.pamt||'')}" placeholder="e.g. 1000">`)}${F('Payment mode',`<select data-in="pmode">${['UPI','Cash'].map(m=>`<option ${ui.pmode===m?'selected':''}>${m}</option>`).join('')}</select>`)}<button class="btn pri" data-a="opay">Save payment</button></div>
<div class="card"><h2>Payment History</h2>${PY().length?PY().slice().reverse().map(p=>`<div class="kv"><span>${fdy(p.d)}</span><b>₹${p.amt} · ${esc(p.mode)}</b></div>`).join(''):'<p class="m" style="margin:0">No payments yet.</p>'}</div>
<div class="card"><h2>Leave History</h2>${L.length?L.map(l=>`<div class="kv"><span style="display:block">${fdy(l.date)}<br><span class="m">${esc(l.reason)}</span></span><span class="chip i">${ic('cal',16)}${l.status==='APPLIED'?'Applied':esc(l.status)}</span></div>`).join(''):'<p class="m" style="margin:0">No leaves.</p>'}</div>`})}
function ostudents(){if(ui.view){const st=S.students.find(x=>x.id===ui.view);if(st)return odetail(st)}const A=allStats(),sm=f=>A.reduce((a,x)=>a+f(x),0);
return`${hd('Students','Tap a student to view their account')}<button class="btn out" data-a="ocsv" style="margin-bottom:16px">${ic('download',18)}Download monthly report (CSV)</button><div class="card"><h2>All students this month</h2><div class="grid3">${[['Present Days',sm(x=>x.s.P)],['Absent Days',sm(x=>x.s.A)],['Leave Days',sm(x=>x.s.V)]].map(tile).join('')}</div><div class="kv" style="margin-top:16px"><span>Total Meals</span><b>${sm(x=>x.s.L+x.s.D)}</b></div></div>
${A.map(x=>`<div class="card clickable" role="button" tabindex="0" data-a="oview" data-s="${x.st.id}" aria-label="View ${esc(x.st.name)}"><div class="row" style="align-items:flex-start"><div style="min-width:0;flex:1"><b>${esc(x.st.name)}</b><div class="m">${x.st.id} · Room ${esc(x.st.room)}${x.st.location?' · '+esc(x.st.location):''}</div></div>${dchip(x.td,'Today: ')}</div><div class="grid3" style="margin-top:12px">${[['Present',x.s.P],['Absent',x.s.A],['Leaves',x.s.V],['Lunch',x.s.L],['Dinner',x.s.D],['Meals',x.s.L+x.s.D]].map(tile).join('')}</div></div>`).join('')}`}
function oprofile(){return`${hd('Profile','Mess Owner')}<div class="card"><div class="kv"><span>Role</span><b>Mess Owner</b></div><div class="kv"><span>Username</span><b>owner</b></div></div><button class="btn out" data-a="logout">${ic('logout',18)}Log out</button>`}
/* ===== render ===== */
function setView(html,navItems){document.getElementById('app').innerHTML=html+(toastMsg?`<div class="toast" role="status" aria-live="polite">${toastMsg}</div>`:'');
document.getElementById('nav').innerHTML=navItems?`<div>${navItems.map(n=>`<button ${tab===n[0]?'aria-current="page"':''} class="${tab===n[0]?'act':''}" data-a="tab" data-t="${n[0]}"><span class="pill">${ic(n[1],22)}</span>${n[2]}</button>`).join('')}</div>`:''}
function render(){const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&!toastMsg&&ae.type!=='radio')return;
if(S.loading){setView('<p class="m" style="text-align:center;margin-top:40vh">Loading…</p>');return}
if(!cfgOk()){setView('<div class="hd"><h1>Setup needed</h1></div><div class="card">Open index.html and paste your Supabase Project URL and anon key near the top of the script. See README.md.</div>');return}
if(ui.recovery){setView(resetScreen());return}
const u=S.user;
if(!u)setView(login());
else if(u.role==='owner')setView(({otoday,oattend,ostudents,oprofile}[tab]||otoday)(),[['otoday','dash','Today'],['oattend','clip','Attendance'],['ostudents','users','Students'],['oprofile','user','Profile']]);
else setView(({home,meals,leave,fees,profile}[tab]||home)(),[['home','home','Home'],['meals','utensils','Meals'],['leave','cal','Leave'],['fees','wallet','Fees'],['profile','user','Profile']])}

let busy=false;
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled||busy)return;const a=b.dataset.a;if(a==='eye'){const i=b.parentElement.querySelector('input'),sh=i.type==='password';i.type=sh?'text':'password';b.innerHTML=ic(sh?'eyeoff':'eye',20);b.setAttribute('aria-label',sh?'Hide password':'Show password');return}if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();busy=true;
try{if(a==='tab'){tab=b.dataset.t;ui.date='';ui.view='';render();scrollTo(0,0)}
else if(a==='goleave'){tab='leave';render();scrollTo(0,0)}
else if(a==='apply')await applyLeave();
else if(a==='omark')await ownerMark(b.dataset.s,b.dataset.m,b.dataset.v);
else if(a==='oview')await openStudent(b.dataset.s);
else if(a==='oback'){ui.view='';render();scrollTo(0,0)}
else if(a==='opay')await recordPayment();
else if(a==='osave')await saveStudent();
else if(a==='ocsv')exportCsv();
else if(a==='smode'){ui.mode=b.dataset.m;render()}
else if(a==='lrole'){ui.lrole=b.dataset.r;ui.mode='login';ui.lpin='';render()}
else if(a==='login')await doLogin();
else if(a==='forgot')await doForgot();
else if(a==='doreset')await doReset();
else if(a==='signup')await doSignup();
else if(a==='verify')await doVerify();
else if(a==='resend')await doResend();
else if(a==='logout'){const wasOwner=S.user&&S.user.role==='owner';await sb.auth.signOut();S=blank();ui={reason:'Going home',note:'',date:'',lrole:wasOwner?'owner':'student'};tab='home';render()}}
catch(err){toast('Something went wrong. Check your internet.')}finally{busy=false}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const k=e.target.dataset.in;if(!k)return;ui[k]=e.target.value;if(k==='date'){ae=null;e.target.blur();render()}});
var ae;S=blank();S.loading=true;if(RECOVERY)ui.recovery=true;if(OWNER_LINK)ui.lrole='owner';
if(cfgOk())sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){ui.recovery=true;render()}});
if(/error_code=otp_expired|error_description=/.test(location.hash)){setTimeout(()=>toast('That reset link has expired. Please request a new one.'),500);try{history.replaceState(null,'',location.pathname)}catch(e){}}
render();
(async()=>{if(cfgOk())await boot();S.loading=false;sync();render()})();
setInterval(render,30000);
setInterval(async()=>{const t=document.activeElement&&document.activeElement.tagName;if(S.user&&!ui.view&&!/INPUT|TEXTAREA|SELECT/.test(t||'')&&!busy){await boot();render()}},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
